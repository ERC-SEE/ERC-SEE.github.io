   <figure class="team-member">
    <img src="/assets/img/Mariana.jpeg" alt="Mariana" class="team">
    <figcaption>Mariana C. Duarte</figcaption>
    <p>Mariana is a postdoctoral researcher at the Institute of Public Goods and Policies, CSIC, Madrid.  Her research explore the dynamics of public opinion and political behaviour on diverse political issues, including the European Union and immigration. Her work has been published in the <i>Journal of European Public Policy</i>, <i>European Journal of Political Research</i>, <i>Political Science Research and Methods</i>, and <i>West European Politics</i>, among others. She received her PhD in Political and Social Sciences from the European University Institute in 2023. </p>
  </figure>
  
  <figure class="team-member">
    <img src="/assets/img/Pedro.png" alt="Pedro" class="team">
    <figcaption>Pedro Martín-Cadenas</figcaption>
    <p>Pedro is a postdoctoral researcher at the Institute of Public Goods and Policies (IPP-CSIC). His work examines the interplay between economic and political inequality. Specifically, he investigates how various dimensions of inequality influence political attitudes and behavior, utilizing quantitative methodologies. He received her PhD from the European University Institute in 2025. During his doctoral studies, he was a visiting researcher at the IPZ, University of Zurich. Before joining the IPP, he was a postdoctoral researcher in the Methods Research department at the Research Center on Inequality and Social Policy, University of Bremen.</p>
  </figure>

  <figure class="team-member">
    <img src="/assets/img/Fernando.jpg" alt="Fernando" class="team">
    <figcaption>Fernando Martín</figcaption>
    <p>Fernando is a postdoctoral student at CSIC. His research focuses on the political economy of housing. He studies how housing affects political preferences in different contexts, from homeownership status to rising housing costs and it's geographical location, and how these individual preferences influence electoral politics.</p>
  </figure>

     <figure class="team-member.ra">
    <img src="/assets/img/Edgar.jpg" alt="Edgar" class="team">
    <figcaption>Edgar Chicurel</figcaption>
    <p>Edgar is pursuing a PhD in Statistics for Data Science working at IPP-CSIC. He is an economist and data scientist with a strong background in econometrics and macroeconomic analysis. His work includes working with complex datasets to uncover insights that support decision-making.</p>
  </figure>
